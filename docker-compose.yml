services:
  postgres:
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres
    ports:
      # Bind to 127.0.0.1 on a Docker-assigned host port. The actual port
      # changes whenever the container is recreated; sync-deps-env.sh
      # discovers it and writes POSTGRES_URL into .env.docker.
      - "127.0.0.1::5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d app"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "127.0.0.1::8081"
    environment:
      PGWEB_DATABASE_URL: postgres://dev:dev@postgres:5432/app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
