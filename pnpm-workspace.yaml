packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  "@better-auth/core": "1.7.11"
  "@better-auth/utils": "0.5.0"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "esbuild": ">=0.25.0"
  "srvx": ">=0.11.13"
  # GHSA-qx66-fv34-fjm8: better-auth's optional peer otherwise keeps a
  # vulnerable copy for @feedreader/db.
  "@tanstack/react-start": "^1.168.60"

# @axiomhq/logging 0.4.1 still declares peer @axiomhq/js ^1. Its
# AxiomJSTransport only calls ingest() and flush(), which v2 kept; v2 broke
# only the default APL query format, which we do not use. Drop this rule
# once a logging release accepts v2.
peerDependencyRules:
  allowedVersions:
    "@axiomhq/logging>@axiomhq/js": "2"

allowBuilds:
  "@sentry/cli": true
  "core-js": true
  "esbuild": true
  "msw": true
  "protobufjs": true
  "sharp": true

pmOnFail: ignore

# Supply-chain floor: pnpm refuses package versions younger than 7 days,
# matching Dependabot's cooldown. Enforced against the lockfile on every
# pnpm command.
minimumReleaseAge: 10080
# TEMPORARY exact-version exceptions to the floor; each entry names its expiry.
minimumReleaseAgeExclude:
  # Our own package (psg2/env-sync); no waiting period for its releases.
  - "@psg2/env-sync"
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4
