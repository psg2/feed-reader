packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  "@better-auth/core": "1.7.7"
  "@better-auth/utils": "0.5.0"
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "esbuild": ">=0.25.0"
  "srvx": ">=0.11.13"
  # GHSA-qx66-fv34-fjm8: better-auth's optional peer otherwise keeps a
  # vulnerable copy for @feedreader/db.
  "@tanstack/react-start": "^1.168.60"

# @axiomhq/logging 0.4.1 still declares peer @axiomhq/js ^1. Its
# AxiomJSTransport only calls ingest() and flush(), which v2 kept; v2 broke
# only the default APL query format, which we do not use. Drop this rule
# once a logging release accepts v2.
peerDependencyRules:
  allowedVersions:
    "@axiomhq/logging>@axiomhq/js": "2"

allowBuilds:
  "@sentry/cli": true
  "core-js": true
  "esbuild": true
  "msw": true
  "protobufjs": true
  "sharp": true

pmOnFail: ignore

# Supply-chain floor: pnpm refuses package versions younger than 7 days,
# matching Dependabot's cooldown. Enforced against the lockfile on every
# pnpm command.
minimumReleaseAge: 10080
# TEMPORARY: TanStack's 2026-09-30 release patches GHSA-qx66-fv34-fjm8
# (reflected XSS in server-function responses; Vercel refuses to deploy
# @tanstack/react-start < 1.168.60). These are the exact versions it pulls
# in; the newest was published 2026-09-30T17:51Z, so delete this whole list
# after 2026-10-07 18:00 UTC. Exact versions keep later bumps of the same
# packages under the floor.
minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/react-start-client@1.168.39"
  - "@tanstack/react-start-rsc@0.1.59"
  - "@tanstack/react-start-server@1.167.46"
  - "@tanstack/react-start@1.168.60"
  - "@tanstack/react-store@0.11.2"
  - "@tanstack/router-core@1.171.34"
  - "@tanstack/router-generator@1.167.40"
  - "@tanstack/router-plugin@1.168.42"
  - "@tanstack/start-client-core@1.170.34"
  - "@tanstack/start-plugin-core@1.171.49"
  - "@tanstack/start-server-core@1.169.39"
  - "@tanstack/start-storage-context@1.167.36"
  - "@tanstack/store@0.11.2"
  # Renovate security update: @modelcontextprotocol/sdk@1.31.0
  - "@modelcontextprotocol/sdk@1.31.0"
