packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  "@better-auth/core": "1.7.5"
  "@better-auth/utils": "0.5.0"
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "esbuild": ">=0.25.0"
  "srvx": ">=0.11.13"

# @axiomhq/logging 0.4.1 still declares peer @axiomhq/js ^1. Its
# AxiomJSTransport only calls ingest() and flush(), which v2 kept; v2 broke
# only the default APL query format, which we do not use. Drop this rule
# once a logging release accepts v2.
peerDependencyRules:
  allowedVersions:
    "@axiomhq/logging>@axiomhq/js": "2"

allowBuilds:
  "@sentry/cli": true
  "core-js": true
  "esbuild": true
  "msw": true
  "protobufjs": true
  "sharp": true

pmOnFail: ignore

# Supply-chain floor: pnpm refuses package versions younger than 7 days,
# matching Dependabot's cooldown. Enforced against the lockfile on every
# pnpm command.
minimumReleaseAge: 10080
# TEMPORARY: exact versions the 2026-09-23 batches (#23, #25) locked before
# the floor existed. The newest was published 2026-09-22T11:51Z, so delete
# this whole list after 2026-09-29 12:00 UTC. Exact versions keep later
# bumps of the same packages under the floor.
