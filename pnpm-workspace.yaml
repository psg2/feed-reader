packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

overrides:
  "@better-auth/core": "1.7.9"
  "@better-auth/utils": "0.5.0"
  "react": "19.3.0"
  "react-dom": "19.3.0"
  "esbuild": ">=0.25.0"
  "srvx": ">=0.11.13"
  # GHSA-qx66-fv34-fjm8: better-auth's optional peer otherwise keeps a
  # vulnerable copy for @feedreader/db.
  "@tanstack/react-start": "^1.168.60"

# @axiomhq/logging 0.4.1 still declares peer @axiomhq/js ^1. Its
# AxiomJSTransport only calls ingest() and flush(), which v2 kept; v2 broke
# only the default APL query format, which we do not use. Drop this rule
# once a logging release accepts v2.
peerDependencyRules:
  allowedVersions:
    "@axiomhq/logging>@axiomhq/js": "2"

allowBuilds:
  "@sentry/cli": true
  "core-js": true
  "esbuild": true
  "msw": true
  "protobufjs": true
  "sharp": true

pmOnFail: ignore

# Supply-chain floor: pnpm refuses package versions younger than 7 days,
# matching Dependabot's cooldown. Enforced against the lockfile on every
# pnpm command.
minimumReleaseAge: 10080
# TEMPORARY exact-version exceptions to the floor; each entry names its expiry.
minimumReleaseAgeExclude:
  # Our own package (psg2/env-sync); no waiting period for its releases.
  - "@psg2/env-sync"
  # better-auth 1.7.8 stops a failed oauth_resources seed at startup from
  # breaking auth for the whole function instance (better-auth#10887), which
  # hits us on Neon cold starts. Drop these after 2026-10-22.
  - "better-auth@1.7.9"
  - "@better-auth/api-key@1.7.9"
  - "@better-auth/cimd@1.7.9"
  - "@better-auth/core@1.7.9"
  - "@better-auth/drizzle-adapter@1.7.9"
  - "@better-auth/kysely-adapter@1.7.9"
  - "@better-auth/memory-adapter@1.7.9"
  - "@better-auth/mongo-adapter@1.7.9"
  - "@better-auth/oauth-provider@1.7.9"
  - "@better-auth/prisma-adapter@1.7.9"
  - "@better-auth/telemetry@1.7.9"
